; ChromeGreen (version.dll) configuration file
; Lines starting with a semicolon (;) are comments and have no effect.
; Toggle options: 0 = off, 1 = on. Leaving a value empty or omitting the key uses the default.
; Deleting this file reverts to the built-in default configuration.
; Paths support Windows environment variables (e.g. %appdata%); %app% refers to the directory containing chrome.exe.
; Wrap paths containing spaces in double quotes ("").

[general]

; Leave empty = built-in default data directory; "none" = the browser's default user-data path.
; If the browser path is set by other means, this option is ignored.
data_dir=%app%\..\Data
cache_dir=%app%\..\Cache

; Append Chromium command-line switches (mind the spaces; do not wrap lines).
; e.g. command_line=--disable-features=OutdatedBuildDetector --disable-field-trial-config
command_line=

; Program or command launched together with the browser (same syntax as launch_on_exit).
launch_on_startup=

; Program or command executed when the browser exits; separate multiple entries with a semicolon (;), and end the line with a semicolon.
; e.g. start "chrome_green cmd" cmd /c <command>
; e.g. launch_on_exit="D:\Google Chrome\App\clean.bat";taskkill /f /im chrome.exe;
launch_on_exit=

; Boss key: a custom hotkey that hides all Chrome windows when pressed, and restores them
; (muting/unmuting audio at the same time) when pressed again.
; Available keys: Ctrl, Alt, Shift, Win, F1-F12, 0-9, A-Z, arrow keys, etc. Example: Ctrl+Alt+B
boss_key=

; Translation hotkey: custom hotkey for web-page translation; same format as the boss key.
translate_key=

; Open-new-window hotkey: opens a new Chrome window when pressed; same format as the boss key.
open_new_window=

; Open-URL-group hotkey: batch-opens the [url_group] list as new tabs when pressed; same format as the boss key.
open_url_group=

; Show saved passwords without verification (reveal password plaintext without the system login password). 0 = off, 1 = on.
show_password=1

; Configuration page appearance (ChromeGreen addition; can also be set in the config page).
; theme:    auto / light / dark
; language: auto / zh-CN / en
theme=auto
language=auto

; Force-disable Chrome's win32k lockdown (i.e. enable win32k support).
; Off by default; only enable if ChromeGreen causes Chrome to crash on startup.
; Do not use together with mactype (exclude Chrome in mactype).
win32k=0

; Block reading Chrome enterprise policies from the registry (on by default).
ignore_policies=1

; Suppress the bogus "out of date" upgrade prompt on the portable build.
; The portable build has no updater component, so version checks are invalid and show a prompt
; that cannot be cleared by restarting.
; Only removes this error prompt; does not disable real update notifications. To also suppress the
; outdated-version warning, append: command_line=--disable-features=OutdatedBuildDetector
; On by default.
suppress_false_upgrade_notification=1

; Key mappings: source_key=target_key, or source_key=command:commandID
; Available keys: Ctrl, Alt, Shift, Win, F1-F12, A-Z, 0-9, etc.
; Command IDs: https://github.com/chromium/chromium/blob/main/chrome/app/chrome_command_ids.h
; Examples: F2=Ctrl+PageUp   Alt+Shift+S=command:40015
[keymapping]
; F2=Ctrl+PageUp
; Alt+Shift+S=command:40015

; Update feature (ChromeGreen addition)
[update]
; Update channel: stable / beta / dev / canary
channel=stable
; Whether to automatically check for updates
auto_check=1
; Automatic check interval (hours)
check_interval=24
; Whether to auto-download when an update is found
auto_download=0
; Whether to keep the installer after updating
keep_installer=0
; Whether to keep the old version directory when updating
keep_old_versions=0
; Download proxy (leave empty = none); proxy_type: HTTP / SOCKS5 / GH_PROXY
;   GH_PROXY: accelerate GitHub fetches via a public mirror (e.g.
;   https://gh.noki.eu.org). Proxies BOTH the version.dll self-update download
;   AND the version check (raw.githubusercontent.com / api.github.com /
;   github.com release tag). Chrome installer downloads never use a proxy even
;   if proxy_chrome_download=1 (the mirror only serves GitHub).
proxy=
proxy_type=HTTP
; Whether the Chrome installer download also uses this proxy (ignored when proxy_type=GH_PROXY)
proxy_chrome_download=0
; Download source: 0=edgedl.me.gvt1.com  1=dl.google.com (default)  2=www.google.com  3=redirector.gvt1.com
download_source=1

; Tab enhancement (ported from chrome_plus tabbookmark; configured in the
; config page under "标签页增强配置")
[tabs]
; Keep at least one tab open (never close the last tab). 0 = off, 1 = on
keep_last_tab=1
; Double-click a tab to close it. 0 = off, 1 = on
double_click_close=1
; Right-click a tab to close it (hold Shift to show the original menu). 0 = off, 1 = on
right_click_close=0
; Mouse wheel over the tab bar switches tabs. 0 = off, 1 = on
wheel_tab=1
; Mouse wheel switches tabs while the right button is held. 0 = off, 1 = on
wheel_tab_when_press_rbutton=1
; Hover (dwell) on a tab to activate it. 0 = off, 1 = on
hover_tab=0
; Hover dwell delay in milliseconds (0-5000); only used when hover_tab=1
hover_tab_delay=400
; Open the address-bar URL in a new tab on Enter: 0 = off, 1 = Alt+Enter, 2 = Shift+Alt+Enter
open_url_new_tab=0
; Open a bookmark in a new tab: 0 = off, 1 = middle+Shift click, 2 = middle click
open_bookmark_new_tab=0
; Disable the new-tab-page enhancements below for tabs whose title contains
; any of the comma-separated names (e.g. new_tab_disable_name=New Tab,新标签页)
new_tab_disable=1
new_tab_disable_name=

; Batch-open URL list (one per line, keyed 1,2,3,...). Used by the
; open_url_group hotkey: each entry opens in its own new tab.
[url_group]
;1=https://www.google.com
;2=https://www.bing.com
