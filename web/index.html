<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Apply the persisted theme before first paint to avoid a light->dark flash on reload. -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("chrome_green_theme") || "auto";
        var dark =
          mode === "dark" ||
          (mode === "auto" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var d = document.documentElement;
        if (dark) {
          d.classList.add("dark");
          d.style.colorScheme = "dark";
          d.style.backgroundColor = "#090f1a";
        } else {
          d.style.colorScheme = "light";
        }
      } catch (e) {}
    })();
  </script>
  <title>ChromeGreen - Configuration</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
